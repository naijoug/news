services:
  news-aggregator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news-aggregator
    ports:
      - '3000:3000'
    volumes:
      # Persist database
      - ./data:/app/data
      # Persist platform config
      - ./backend/src/config:/app/src/config:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/news.db
      - CRAWL_SCHEDULE=0 8,20 * * *
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/api/platforms']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
